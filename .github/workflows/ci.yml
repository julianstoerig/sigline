name: CI

# one linux job per pull request: linux runners cost the fewest minutes,
# and one job installs once. the full matrix is in compat.yml, run by hand.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  MPLBACKEND: Agg

jobs:
  check:
    name: lint, tests, notebooks, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: sudo apt-get install -y graphviz
      # regular (non-editable) install, so packaging mistakes show up here
      - run: python -m pip install ".[numba]" build twine --group dev
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - name: tests with numba, notebooks included
        run: python -m pytest -rs
      - name: tests without numba
        run: python -m pytest --ignore=tests/test_notebooks.py
        env:
          SIGLINE_NO_NUMBA: "1"
      - run: python -m build
      - run: python -m twine check --strict dist/*
