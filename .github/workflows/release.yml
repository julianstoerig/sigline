name: release

# publishes to pypi when a github release is published.
# uses trusted publishing: no api token is stored in the repository.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: check that the tag matches the package version
        run: |
          version=$(python -c "import re, pathlib; \
            src = pathlib.Path('src/sigline/__init__.py').read_text(); \
            print(re.search(r'__version__ = \"(.+?)\"', src).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          echo "package $version, tag $tag"
          test "$version" = "$tag"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sigline/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
